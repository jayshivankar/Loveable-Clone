<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Todo List</h1>
        <input type="text" id="todo-input" placeholder="Add a new todo..." />
        <button id="add-todo">Add Todo</button>
        <div id="todo-list">
            <p id="no-todos-message">No todos available. Please add a todo.</p>
            <ul id="todos"></ul>
        </div>
        <button id="filter-completed">Show Completed</button>
        <button id="filter-active">Show Active</button>
        <button id="delete-completed">Delete Completed</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
